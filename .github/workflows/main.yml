name: Online phpMyAdmin via Tailscale

on:
  workflow_dispatch:

jobs:
  phpmyadmin-server:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      # 1️⃣ Install Tailscale
      - name: Install Tailscale
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait
          Remove-Item $installer -Force

      # 2️⃣ Connect Tailscale (6-month auth key)
      - name: Start Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) {
              Write-Error "TAILSCALE_AUTH_KEY missing"
              exit 1
          }

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=gh-runner-$env:GITHUB_RUN_ID

          # Wait for IP assignment
          $tsIP = $null
          for ($i=0; $i -lt 20; $i++) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if ($tsIP) { break }
              Write-Host "Waiting for Tailscale IP... ($($i+1)/20)"
              Start-Sleep -Seconds 10
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned"
              & "$env:ProgramFiles\Tailscale\tailscale.exe" status
              exit 1
          }

          Write-Host "Tailscale IP: $tsIP"
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      # 3️⃣ Install IIS + PHP
      - name: Install IIS + PHP
        run: |
          # IIS features
          Add-WindowsFeature Web-Server, Web-WebServer, Web-Common-Http, Web-Default-Doc, Web-Static-Content, Web-ASP-Net45, Web-ISAPI-Ext, Web-ISAPI-Filter
          # Install PHP via Chocolatey
          choco install php --version=8.2 -y
          Start-Service W3SVC

      # 4️⃣ Install MySQL + phpMyAdmin
      - name: Install MySQL + phpMyAdmin
        run: |
          # Install MySQL
          choco install mysql -y
          $rootPass = -join ((1..16) | ForEach-Object { ([char[]](33..126)) | Get-Random })
          & "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysqladmin.exe" -u root password $rootPass
          echo "MYSQL_ROOT=$rootPass" >> $env:GITHUB_ENV

          # phpMyAdmin
          $pmaDir = "C:\inetpub\wwwroot\phpMyAdmin"
          New-Item -Path $pmaDir -ItemType Directory -Force
          Invoke-WebRequest -Uri "https://www.phpmyadmin.net/downloads/phpMyAdmin-latest-all-languages.zip" -OutFile "$env:TEMP\pma.zip"
          Expand-Archive "$env:TEMP\pma.zip" -DestinationPath $pmaDir
          Remove-Item "$env:TEMP\pma.zip"
          Write-Host "phpMyAdmin installed at $pmaDir"

      # 5️⃣ Open firewall for HTTP
      - name: Open HTTP port
        run: |
          netsh advfirewall firewall add rule name="HTTP-Tailscale" dir=in action=allow protocol=TCP localport=80

      # 6️⃣ Display Access Info
      - name: Show Access Info
        run: |
          Write-Host "`n==============================="
          Write-Host "✅ Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "✅ MySQL Root: $env:MYSQL_ROOT"
          Write-Host "✅ phpMyAdmin URL: http://$env:TAILSCALE_IP/phpMyAdmin"
          Write-Host "==============================="

      # 7️⃣ Keep server alive
      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Server active..."
              Start-Sleep -Seconds 300
          }

name: Online phpMyAdmin via Tailscale

on:
  workflow_dispatch:

jobs:
  phpmyadmin-server:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      # 1️⃣ Install IIS (Web Server)
      - name: Install IIS
        run: |
          Add-WindowsFeature Web-Server, Web-WebServer, Web-Common-Http, Web-Default-Doc, Web-Static-Content, Web-ASP
          Write-Host "✅ IIS installed"

      # 2️⃣ Install PHP
      - name: Install PHP
        run: |
          choco install php -y
          Write-Host "✅ PHP installed"
      
      # 3️⃣ Install MySQL
      - name: Install MySQL
        run: |
          choco install mysql -y
          # Generate 16-char alphanumeric root password (safe for CLI)
          $rootPass = -join ((1..16) | ForEach-Object { ([char[]](48..57 + 65..90 + 97..122) | Get-Random) })
          # Initialize MySQL root password safely
          & "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe" -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '$rootPass'; FLUSH PRIVILEGES;"
          echo "MYSQL_ROOT=$rootPass" >> $env:GITHUB_ENV
          Write-Host "✅ MySQL installed, root password set"

      # 4️⃣ Download & Configure phpMyAdmin
      - name: Install phpMyAdmin
        run: |
          $pmaDir = "C:\inetpub\wwwroot\phpMyAdmin"
          Invoke-WebRequest -Uri "https://www.phpmyadmin.net/downloads/phpMyAdmin-latest-all-languages.zip" -OutFile "$env:TEMP\pma.zip"
          Expand-Archive "$env:TEMP\pma.zip" -DestinationPath $pmaDir -Force
          Remove-Item "$env:TEMP\pma.zip"
          Write-Host "✅ phpMyAdmin installed at $pmaDir"

      # 5️⃣ Install & Connect Tailscale
      - name: Install Tailscale
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait
          Remove-Item $installer -Force
          Write-Host "✅ Tailscale installed"

      - name: Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) { Write-Error "TAILSCALE_AUTH_KEY missing"; exit 1 }
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=gh-runner-$env:GITHUB_RUN_ID
          # Wait for Tailscale IP
          $tsIP = $null
          for ($i=0; $i -lt 20; $i++) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if ($tsIP) { break }
              Write-Host "Waiting for Tailscale IP... ($($i+1)/20)"
              Start-Sleep -Seconds 5
          }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "✅ Tailscale IP assigned: $tsIP"

      # 6️⃣ Display phpMyAdmin URL & MySQL root password
      - name: Show Access Info
        run: |
          Write-Host "`n==============================="
          Write-Host "✅ phpMyAdmin ACCESS DETAILS"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "phpMyAdmin URL: http://$env:TAILSCALE_IP/phpMyAdmin"
          Write-Host "MySQL Root Password: $env:MYSQL_ROOT"
          Write-Host "==============================="

      # 7️⃣ Keep Runner Alive
      - name: Keep session alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Server active..."
              Start-Sleep -Seconds 300
          }
